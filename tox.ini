[tox]
isolated_build = true
envlist = py310, py311, py312, py313, py314, lint

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv:lint]
allowlist_externals =
    isort
    black
    flake8
    poetry
    mkdocs
    twine
deps =
    poetry
basepython = python3.12
commands_pre =
    poetry install --with doc,dev
commands =
    isort cfg4py
    black cfg4py tests
    flake8 cfg4py tests
    poetry build
    mkdocs build
    twine check dist/*

[testenv]
allowlist_externals = pytest
extras =
    test
passenv = *
setenv =
    PYTHONPATH = {toxinidir}
    PYTHONWARNINGS = ignore
commands =
    pytest -s --cov=cfg4py --cov-append --cov-report=xml --cov-report term-missing tests
